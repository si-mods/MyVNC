name: Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    # Same-repo work runs on the desk machine yibo-pc, whose self-hosted
    # runner skips the windows-latest queue. That includes releases: the queue
    # held v0.1.3 for a quarter of an hour. Fork PRs stay on a hosted runner,
    # since their code must never execute on a self-hosted machine.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'windows-latest' || fromJSON('["self-hosted","Windows","X64","yibo-pc"]') }}
    steps:
      - uses: actions/checkout@v4

      # A self-hosted Windows runner can have a stripped PATH; the bash and
      # pwsh steps below need what a normal logon has.
      - name: Put bash and pwsh on PATH
        if: runner.environment == 'self-hosted'
        shell: powershell
        run: |
          @("$env:ProgramFiles\Git\bin", "$env:ProgramFiles\Git\usr\bin", "$env:ProgramFiles\PowerShell\7") |
            Where-Object { Test-Path $_ } |
            ForEach-Object { $_ | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8 }

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # yibo-pc keeps its module cache across runs, so the Actions cache
          # only adds a multi-minute upload at the end of each build.
          cache: ${{ runner.environment == 'github-hosted' }}

      - name: gofmt
        shell: bash
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "Needs gofmt:"; echo "$out"; exit 1; fi

      - name: Vet
        run: go vet ./...
        env:
          CGO_ENABLED: "0"

      - name: Test
        shell: bash
        run: |
          go test -count=1 -v ./... 2>&1 | tee test.log
          rc=${PIPESTATUS[0]}
          # Skips do not fail the build, but they are listed with the reason.
          {
            echo "### Skipped tests"
            grep -B1 -E -- '--- SKIP' test.log | grep -v -- '^--$' || echo "none"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Check the tag matches mygo.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: |
          $v = (Get-Content mygo.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$v") { throw "tag $env:GITHUB_REF_NAME does not match mygo.json version $v" }

      # Signing is optional: without the secrets the build is unsigned.
      - name: Enable code signing
        id: sign
        shell: powershell
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { Write-Host "No WINDOWS_CERTIFICATE secret; building unsigned."; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'code-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $cfg = Get-Content mygo.json -Raw | ConvertFrom-Json
          $cfg | Add-Member -NotePropertyName windows -NotePropertyValue ([pscustomobject]@{ certificate = $pfx }) -Force
          $cfg | ConvertTo-Json -Depth 10 | Set-Content mygo.json -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value 'signed=true' -Encoding ascii

      - name: Build
        run: go tool mygo build -platform windows/amd64
        env:
          CGO_ENABLED: "0"
          MYGO_UPDATER_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.MYGO_UPDATER_PRIVATE_KEY || '' }}
          MYGO_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      - name: Check the update manifest exists
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [ ! -f build/windows-amd64/update-windows-amd64.json ]; then
            echo "No update manifest; is the MYGO_UPDATER_PRIVATE_KEY secret set?"; exit 1
          fi

      - name: Verify signature
        if: steps.sign.outputs.signed == 'true'
        shell: powershell
        run: |
          Get-ChildItem build/windows-amd64/*.exe | ForEach-Object {
            $s = Get-AuthenticodeSignature $_
            "$($_.Name): $($s.Status)"
            if ($s.SignerCertificate -eq $null) { throw "$($_.Name) is not signed" }
          }

      # The test installs and uninstalls for the current user, so it needs one
      # with no MyVNC; yibo-pc, which builds every release, has 0.1.1 installed.
      - name: Test the installer (install, launch, uninstall; hosted runners only)
        if: runner.environment == 'github-hosted'
        shell: powershell
        run: |
          $setup = Get-ChildItem build/windows-amd64 -Filter '*Setup*.exe' | Select-Object -First 1
          .github/scripts/test-installer.ps1 -Installer $setup.FullName

      - name: Name the release files and checksum them
        shell: powershell
        working-directory: build/windows-amd64
        run: |
          $v = (Get-Content ../../mygo.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force ../release | Out-Null
          Copy-Item (Get-ChildItem -Filter '*Setup*.exe' | Select-Object -First 1) "../release/MyVNC-Setup-$v-amd64.exe"
          Copy-Item MyVNC.exe "../release/MyVNC-$v-amd64.exe"
          # Update files keep the names the manifest's URLs point at.
          Copy-Item update-*.json, *.tar.gz, *.delta ../release -ErrorAction SilentlyContinue
          Set-Location ../release
          Get-ChildItem -File | Where-Object Name -ne SHA256SUMS.txt | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content SHA256SUMS.txt -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: MyVNC-windows-amd64
          path: build/release/*

  build-macos:
    # Same-repo work runs on si-mods' Mac mini, whose keychain signing needs
    # macOS — the Windows job can cross-compile darwin but ships it unsigned.
    # Fork PRs stay on a hosted runner and get an ad-hoc signed app.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'macos-latest' || fromJSON('["self-hosted","macOS","ARM64"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: ${{ runner.environment == 'github-hosted' }}

      # Signing is optional: without the secrets the app is ad-hoc signed,
      # which Gatekeeper only accepts on the Mac that built it.
      - name: Enable code signing
        id: sign
        env:
          P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          [[ -n $P12 && -n $P12_PASSWORD ]] || { echo "No MACOS_DEVELOPER_ID_P12; building unsigned."; exit 0; }
          kc="$RUNNER_TEMP/signing.keychain-db" pw=$(uuidgen)
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          (umask 077; printf '%s' "$P12" | base64 -D > "$RUNNER_TEMP/id.p12")
          security import "$RUNNER_TEMP/id.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/id.p12"
          jq '.macos.signingIdentity = "4BEDB5A61743F8C4141CD0982026E5B7756B22D4"' mygo.json > "$RUNNER_TEMP/mygo.json"
          mv "$RUNNER_TEMP/mygo.json" mygo.json
          # Tags also get a notarized disk image; the notary credentials of
          # the team App Store Connect key live in the same keychain.
          if [[ $GITHUB_REF == refs/tags/v* && -n $ASC_KEY_P8 ]]; then
            (umask 077; printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8")
            xcrun notarytool store-credentials myvnc-notary --keychain "$kc" \
              --key "$RUNNER_TEMP/AuthKey.p8" --key-id 6GG554C43Y --issuer 1b9ef96d-c5b4-49a9-8c8d-4f0b999da4d6
            rm -f "$RUNNER_TEMP/AuthKey.p8"
            jq --arg kc "$kc" '.macos.notarize = {keychainProfile: "myvnc-notary", keychain: $kc}' mygo.json > "$RUNNER_TEMP/mygo.json"
            mv "$RUNNER_TEMP/mygo.json" mygo.json
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build
        run: go tool mygo build -platform darwin/arm64
        env:
          CGO_ENABLED: "0"
          MYGO_UPDATER_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.MYGO_UPDATER_PRIVATE_KEY || '' }}

      - name: Check the update manifest exists
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ ! -f build/darwin-arm64/update-darwin-arm64.json ]; then
            echo "No update manifest; is the MYGO_UPDATER_PRIVATE_KEY secret set?"; exit 1
          fi

      - name: Verify signature
        if: steps.sign.outputs.signed == 'true'
        run: |
          app=$(ls -d build/darwin-arm64/*.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dvvv "$app" 2>&1 | grep -E "Signature|TeamIdentifier"
          # On tags the disk image is notarized; stapler must find its ticket.
          for d in build/darwin-arm64/*.dmg; do
            [ -e "$d" ] && xcrun stapler validate "$d" || true
          done

      - name: Name the release files and checksum them
        working-directory: build/darwin-arm64
        run: |
          v=$(jq -r .version ../../mygo.json)
          mkdir -p ../release
          # Update files keep the names the manifest's URLs point at; the
          # disk image is the user-facing download and gets the app's name.
          for d in *.dmg; do [ -e "$d" ] && cp "$d" "../release/MyVNC-$v-arm64.dmg"; done
          cp update-*.json *.tar.gz *.delta ../release 2>/dev/null || true
          cd ../release
          for f in *; do
            if [ "$f" != SHA256SUMS.txt ]; then shasum -a 256 "$f"; fi
          done > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: MyVNC-darwin-arm64
          path: build/release/*
