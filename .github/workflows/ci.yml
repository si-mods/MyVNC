name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        shell: bash
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "Needs gofmt:"; echo "$out"; exit 1; fi

      - name: Vet
        run: go vet ./...
        env:
          CGO_ENABLED: "0"

      - name: Test
        shell: bash
        run: |
          go test -count=1 -v ./... 2>&1 | tee test.log
          rc=${PIPESTATUS[0]}
          # Skips do not fail the build, but they are listed with the reason.
          {
            echo "### Skipped tests"
            grep -B1 -E -- '--- SKIP' test.log | grep -v -- '^--$' || echo "none"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Check the tag matches mygo.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Get-Content mygo.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$v") { throw "tag $env:GITHUB_REF_NAME does not match mygo.json version $v" }

      # Signing is optional: without the secrets the build is unsigned.
      - name: Enable code signing
        id: sign
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { Write-Host "No WINDOWS_CERTIFICATE secret; building unsigned."; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'code-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $cfg = Get-Content mygo.json -Raw | ConvertFrom-Json
          $cfg | Add-Member -NotePropertyName windows -NotePropertyValue ([pscustomobject]@{ certificate = $pfx }) -Force
          $cfg | ConvertTo-Json -Depth 10 | Set-Content mygo.json -Encoding utf8
          "signed=true" >> $env:GITHUB_OUTPUT

      - name: Build
        run: go tool mygo build
        env:
          CGO_ENABLED: "0"
          MYGO_UPDATER_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.MYGO_UPDATER_PRIVATE_KEY || '' }}
          MYGO_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      - name: Check the update manifest exists
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [ ! -f build/windows-amd64/update-windows-amd64.json ]; then
            echo "No update manifest; is the MYGO_UPDATER_PRIVATE_KEY secret set?"; exit 1
          fi

      - name: Verify signature
        if: steps.sign.outputs.signed == 'true'
        shell: pwsh
        run: |
          Get-ChildItem build/windows-amd64/*.exe | ForEach-Object {
            $s = Get-AuthenticodeSignature $_
            "$($_.Name): $($s.Status)"
            if ($s.SignerCertificate -eq $null) { throw "$($_.Name) is not signed" }
          }

      - name: Test the installer (install, launch, uninstall)
        shell: pwsh
        run: |
          $setup = Get-ChildItem build/windows-amd64 -Filter '*Setup*.exe' | Select-Object -First 1
          .github/scripts/test-installer.ps1 -Installer $setup.FullName

      - name: Name the release files and checksum them
        shell: pwsh
        working-directory: build/windows-amd64
        run: |
          $v = (Get-Content ../../mygo.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force ../release | Out-Null
          Copy-Item (Get-ChildItem -Filter '*Setup*.exe' | Select-Object -First 1) "../release/MyVNC-Setup-$v-amd64.exe"
          Copy-Item MyVNC.exe "../release/MyVNC-$v-amd64.exe"
          # Update files keep the names the manifest's URLs point at.
          Copy-Item update-*.json, *.tar.gz, *.delta ../release -ErrorAction SilentlyContinue
          Set-Location ../release
          Get-ChildItem -File | Where-Object Name -ne SHA256SUMS.txt | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content SHA256SUMS.txt -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: MyVNC-windows-amd64
          path: build/release/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MyVNC-windows-amd64
          path: release
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Created as a draft, so releases/latest never lacks the manifest.
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "MyVNC $GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber release/*
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
