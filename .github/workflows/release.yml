name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: MyVNC-*
          path: release
          merge-multiple: true
      # Each build checksummed its own files; rewrite them for the release.
      - name: Write SHA256SUMS for every asset
        working-directory: release
        run: |
          rm -f SHA256SUMS.txt
          # Written to a hidden file first: the * glob would otherwise pick up
          # SHA256SUMS.txt itself and hash whatever was written so far.
          for f in *; do sha256sum "$f"; done > .sums
          mv .sums SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Created as a draft, so releases/latest never lacks the manifest.
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "MyVNC $GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber release/*
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
